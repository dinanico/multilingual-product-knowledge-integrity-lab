[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-product-knowledge-integrity-lab"
version = "0.1.0"
description = "A reference implementation for preserving product knowledge integrity across multilingual content, AI-assisted translation, and downstream AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Dina Nicolorich"}]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ["certifi>=2023.5.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
product-knowledge-integrity = "product_knowledge_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
